name: fetch
on:
  push:
    branches: [fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: get
        run: |
          mkdir out && cd out
          for n in GHRSST_Sea_Ice_Concentration MODIS_L3_Sea_Ice MODIS_NDSI_Snow_Cover; do
            curl -fsSL --retry 3 -o "$n.xml" "https://gibs.earthdata.nasa.gov/colormaps/v1.3/$n.xml" || echo "$n failed" >> failed.txt
          done
          ls -la
          git init -q && git checkout -q -b out && git add -A
          git -c user.name=dt -c user.email=dt@noreply.invalid commit -qm "fetch"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" out:refs/heads/fetch-out
