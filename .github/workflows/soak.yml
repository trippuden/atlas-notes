name: phone soak
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these live checks, on the desktop job (comma list: watch,tap,poles,ships,news,weather,board (board also runs on both phone engines); poles also runs on both phone engines; hazards alone runs the boot and the EARTH > Hazards hold on every engine, with graphics call timings); empty runs the full soak"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/soak
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: browser
        if: inputs.only == '' || matrix.engine == 'desktop' || contains(inputs.only, 'poles') || contains(inputs.only, 'hazards') || contains(inputs.only, 'board')
        working-directory: .github/soak
        run: npm i --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps ${{ matrix.engine == 'desktop' && 'chromium' || matrix.engine }}
      - name: soak
        if: inputs.only == '' || matrix.engine == 'desktop' || contains(inputs.only, 'poles') || contains(inputs.only, 'hazards') || contains(inputs.only, 'board')
        working-directory: .github/soak
        env:
          ONLY: ${{ inputs.only }}
        # the verdict is the SOAK PASSED / SOAK FAILED line in this log; the step itself never fails, so no failure emails
        run: |
          mkdir -p out
          xvfb-run -a node soak.cjs ${{ matrix.engine }} "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" 5 > out/log.txt 2>&1 || true
          grep -av '^\[pid=' out/log.txt | tail -n 400
          echo "== live checks"; grep -aE '^ *[0-9.]+s (FAIL )?(watch|tap|poles|argo|ships|opensky|news|weather|board|ages|SCROLL)' out/log.txt | cut -c1-900 || true
          echo "== slow frames and crashes"; grep -aE 'SLOW FRAME|stalls over 250 ms|PAGE CRASHED|poles: watch|poles summary|GL during|worst stall before' out/log.txt | cut -c1-600 | head -40 || true
          echo "== fails"; grep -aE '^ *[0-9.]+s FAIL' out/log.txt | cut -c1-700 || true; grep -aE 'SOAK (PASSED|FAILED)' out/log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.engine }}
          path: .github/soak/out
          retention-days: 3
